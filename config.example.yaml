# Настройки minuteforge. Файл необязательный: без него берутся значения по
# умолчанию, а они здесь и написаны. Любое поле переопределяется переменной
# окружения с префиксом MINUTEFORGE_ — например, MINUTEFORGE_ASR_MODEL=small.
#
# Секретам тут не место. Токен HuggingFace читается только из переменной
# окружения HF_TOKEN: вписанный в файл, он рано или поздно попадёт в git.

# --- Распознавание речи ---------------------------------------------------

# Размер модели Whisper: tiny, base, small, medium, large-v3.
# По умолчанию самая крупная: фамилии, названия и цифры она разбирает заметно
# лучше, а ошибка расшифровки въезжает прямо в текст поручения. Платить за это
# приходится временем (примерно вдвое против medium) и видеопамятью (около
# 5 ГБ против 2). Не хватит памяти — расчёт сам спустится на модель поменьше
# и напишет об этом в стенограмме и на экране.
#
# Ставьте medium или small, если считаете на процессоре или если запись
# сделана хорошим микрофоном в тихой комнате: там разница невелика.
asr_model: large-v3

# Язык записи.
language: ru

# Сколько человек говорит. Пусто — определить самой.
# Это НЕ число участников совещания: в списке приглашённых их может быть
# тридцать, а голосов в записи пять. Указывать нужно голоса.
speakers:

# cuda, cpu или auto.
device: auto

# Сколько кусков записи модель обрабатывает за раз. Влияет на видеопамять
# сильно, на качество — никак. При нехватке памяти уменьшается сам.
batch_size: 8

# Не ходить в HuggingFace, если модели уже скачаны. Быстрее на повторных
# запусках и не отмечает лишний раз использование токена. Включайте, когда
# всё уже работает.
offline_models: false

# --- Нарезка стенограммы --------------------------------------------------

# Окно модели в токенах. Отсюда считается размер фрагмента: нарезка нужна
# ровно потому, что стенограмма не влезает в окно целиком.
llm_context_tokens: 8192

# Размер фрагмента вручную. Пусто — считать от окна. Задают его, чтобы
# сделать фрагменты МЕНЬШЕ расчётных: мелкая модель на длинном куске теряет
# поручения из середины. Разумное значение для 7B — 1200.
chunk_max_tokens:

# Сколько реплик повторить в начале следующего фрагмента. Поручение часто
# разложено на две реплики — «подготовьте отчёт» и «до среды», — и на
# границе фрагментов срок теряется.
chunk_overlap_blocks: 1

# Показывать модели только фразы, в которых поручение слышно, вместе с
# соседними, — вместо сплошной нарезки всего совещания. На записи штаба это
# около сотни окон по сотне токенов вместо семи кусков по 4700: втрое меньше
# текста, и терять середину длинного куска модели больше негде.
#
# Цена: что не попало в окно, модель не увидит вовсе. Отбирает то же правило,
# которым поручения отсеиваются и сейчас, — только раньше, до запроса.
# Поставьте false, чтобы вернуть сплошную нарезку и сравнить.
extract_by_phrase: true

# Переспрашивать ли модель по каждому найденному пункту: поручение это или
# изложение доклада. Правилами их уже не отделить — «отходы должны
# накапливаться раздельно» устроено как требование, — а на короткий вопрос
# «да или нет» мелкая модель отвечает надёжно.
#
# Стоит одного запроса на пункт: на семидесяти поручениях это ещё несколько
# минут. Поставьте false, если время дороже точности.
verify_tasks: true

# --- Модель, которая ищет поручения ---------------------------------------

# Адрес сервера: Ollama — 11434, LM Studio — 1234.
llm_base_url: http://localhost:11434/v1

llm_model: mistral

# Модель для проверочного прохода. Пусто — та же, что и выше.
#
# Выписывать и проверять — задачи обратные. Выписывать надо щедро:
# пропущенное поручение не видно никак, а лишнее вычёркивается за секунду по
# цитате рядом. Проверять надо строго.
#
# На записи штаба это разошлось резко: mistral нашёл 79% поручений из
# выписанных вручную, модель вчетверо крупнее — 39%, зато ошибалась вдвое
# реже там, где отвечала. Отсюда и разделение: щедрая выписывает, строгая
# проверяет.
#
# Модели меняются в видеопамяти один раз: проверка идёт после всей выписки, и
# первая перед этим выгружается. Значит на карту нужен размер большей из
# двух, а не их сумма.
llm_verify_model:

# Сводить ли поручения, сказанные разными словами. Правила снимают только
# буквальные повторы, а фрагменты пересекаются, и одно поручение приезжает
# дважды: «подтвердить статус дорожной карты» и «проинформировать о текущем
# статусе дорожной карты». Стоит одного лишнего запроса к модели.
merge_similar: true

# Просить ли строгий JSON. Для мелких моделей это решающая разница: иначе они
# вместо ответа переписывают стенограмму. Сервер, который так не умеет,
# ответит отказом, и запрос повторится по-старому.
llm_json_mode: true

# Что добавить к указаниям модели. Дописывается в конец; правила формата
# ответа этим не трогаются — их изменение сломает разбор. Сюда идёт
# предметное: что считать поручением у вас и как это называть. Например:
#   prompt_extra: |
#     Поручения у нас называются заданиями.
#     Не считай поручением просьбу подключиться или выступить.
prompt_extra: ""

# Файл со своим системным указанием целиком, вместо встроенного. Для тех,
# кто понимает, что делает: правила формата придётся написать самому.
prompt_file:

# То же для проверочного прохода — того, где по каждому найденному пункту
# спрашивают «поручение это или изложение доклада».
#
# Указания здесь нужны обратные. Выписывающей модели объясняют, что считать
# поручением; проверяющей — что поручением НЕ считается, хотя звучит похоже.
# Именно здесь и решается судьба спорных пунктов: на записи штаба проверка
# сняла треть списка.
#
#   verify_prompt_extra: |
#     Планы работ, о которых докладывают, поручением не считай.
#     Просьбу выступить на следующем заседании считай.
#
# Отдельным полем, а не общим с prompt_extra: слитые в одно, указания
# противоречили бы друг другу в каждом запросе.
verify_prompt_extra: ""

# Низкая температура намеренно: задача извлекающая, а не сочинительская.
llm_temperature: 0.1

# Предел длины ответа. Тысячи не хватает: на плотном фрагменте модель
# выписывает десяток поручений и обрывается на полуслове. Оборванный ответ
# разбирается частично — что успело уместиться, то сохранится, — но лучше
# до этого не доводить.
llm_max_tokens: 3000

# Местная модель отвечает медленно, особенно первый запрос после загрузки
# весов. Короткий таймаут здесь ломает работу чаще, чем спасает.
llm_timeout_s: 180
llm_retries: 2

# --- Кого разбирают -------------------------------------------------------

# Справочник того, по кому идёт разбор: у штаба это регионы, у завода —
# площадки и цеха, у холдинга — дочерние общества, у проектного офиса —
# направления работ. Инструмент ни одного из этих делений не знает: список
# приносите вы.
#
# Файл в три колонки, точка с запятой или табуляция, правится в Excel:
#
#   Направление;Как звучит;Кому адресовать
#   Ставропольский край;ставропольск, Ессентуки;Правительству Ставропольского края
#   Северный филиал;северн, Дальний цех;Северному филиалу
#
# Вторая колонка — основы слов, по которым название узнаётся в речи.
# Основа, а не слово целиком: «ставропольск» находит и «Ставропольского», и
# «Ставропольскому». Через запятую — синонимы: города, площадки, старые
# названия. Образец — examples/справочник.csv.
#
# Пусто — графа останется пустой, и об этом будет сказано на экране.
# Выдумывать в неё нечего: услышанное название инструмент не берёт, потому
# что распознавание их коверкает, а неверный адресат хуже пустого.
directory_file:

# Свои слова: чем поручают именно у вас и что у вас поручением не считается.
# Правило, отличающее поручение от доклада, держится на списке слов. Список
# языковой — «прошу», «обеспечьте», «доложите» звучат одинаково везде, — и
# лежит в коде. Но поверх него у каждого своё: «взять на контроль»,
# «отработать», «поручается». И наоборот: на стройке «объект сдать» — строка
# графика, а не задание, у связистов «слышите» — не просьба.
#
#   Раздел;Слова
#   поручают;взять на контроль, отработать, поручается
#   не поручают;слышите, сдать
#
# Дополняет встроенный список, а не заменяет. «Не поручают» сильнее: слово
# оттуда не сделает фразу поручением, даже если оно похоже на повелительное
# наклонение. Образец — examples/слова.csv.
words_file:

# Третья — кому адресовать поручение в готовом документе. Она нужна потому,
# что по-русски это другой падеж: «Правительству Ставропольского края» из
# «Ставропольский край» правилами не выводится, а склонять наугад инструмент
# не станет. Сюда же входит и оборот, которым у вас поручают: напишете
# «Рекомендовать Правительству Ставропольского края» — так пункт и начнётся.
# Колонки нет — в документ пойдёт название как есть.

# Как называть эту графу в протоколе и в таблице поручений.
directory_label: Направление

# Форма протокола: файл с местами вида {{date}} и {{decisions}}. Форма
# документа в каждой организации своя — герб, номер, гриф, свои разделы, — и
# угадать её снаружи нельзя. Образец с перечнем мест — examples/форма.md;
# свою копию с настоящими реквизитами держите рядом с config.yaml, в
# репозиторий ей не место.
#
# Пусто — документ собирается по встроенной разметке. Она годится для
# работы, но не для рассылки за подписью.
form_file:

# --- Пути -----------------------------------------------------------------

# Относительные считаются от папки приложения. Абсолютные берутся как есть —
# в том числе сетевые, и это обычный способ работы: протоколы кладутся туда,
# откуда их забирает другое подразделение, без пересылки.
#
#   output_dir: I:\Протоколы
#   output_dir: \\сервер\общая\Протоколы
#
# Буква диска годится: в домене их раздаёт групповая политика, и у всех они
# одинаковы. Путь UNC (\\сервер\...) нужен в двух случаях: диск подключают
# руками, или приложение работает без сеанса пользователя — из планировщика
# или службы, где подключённых букв нет вовсе.
input_dir: data/input
output_dir: data/output

# Промежуточное: извлечённый звук и результаты шагов. Гигабайты копятся
# именно здесь — двухчасовая запись даёт около 230 МБ одного только wav,
# и он читается на каждом шаге. Держите эту папку на местном диске: на
# сетевом расчёт заметно замедлится, а готовые файлы туда всё равно
# попадут — они весят килобайты.
work_dir: data/work

# Промежуточное убирается, как только протокол готов и сохранён: к этому
# времени стенограмма лежит в output_dir, и пересобрать протокол можно из
# неё, не распознавая заново.
#
# Поставьте true, если собираетесь возвращаться к записи и переразмечать
# голоса с другим их числом — это самый долгий шаг, и кеш его экономит.
keep_work_files: false

# --- Вид ------------------------------------------------------------------

# Заголовок в шапке и на вкладке браузера. В организации у инструмента
# бывает своё имя, и «minuteforge» ей ничего не говорит.
#
#   app_title: Протоколы совещаний
app_title: minuteforge
# Куда писать журнал работы. Он и есть главный инструмент разбора, когда
# протокол вышел не таким, как ждали: в нём видно, сколько поручений вернула
# модель по каждому окну и сколько сняла каждая стадия отсева. Файл на сутки,
# хранится две недели.
log_dir: logs

# DEBUG добавит к этому текст запросов к модели. Помогает, когда она отвечает
# не тем, но журнал пухнет в разы.
log_level: INFO
