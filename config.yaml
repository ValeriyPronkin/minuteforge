# Настройки minuteforge. Файл необязательный: без него берутся значения по
# умолчанию, а они здесь и написаны. Любое поле переопределяется переменной
# окружения с префиксом MINUTEFORGE_ — например, MINUTEFORGE_ASR_MODEL=small.
#
# Секретам тут не место. Токен HuggingFace читается только из переменной
# окружения HF_TOKEN: вписанный в файл, он рано или поздно попадёт в git.

# --- Распознавание речи ---------------------------------------------------

# Размер модели Whisper: tiny, base, small, medium, large-v3.
# Крупнее — точнее и заметно дольше. На записи с плохим микрофоном разница
# между small и medium решающая.
asr_model: medium

# Язык записи.
language: ru

# Сколько человек говорит. Пусто — определить самой.
# Это НЕ число участников совещания: в списке приглашённых их может быть
# тридцать, а голосов в записи пять. Указывать нужно голоса.
speakers:

# cuda, cpu или auto.
device: auto

# Сколько кусков записи модель обрабатывает за раз. Влияет на видеопамять
# сильно, на качество — никак. При нехватке памяти уменьшается сам.
batch_size: 8

# Не ходить в HuggingFace, если модели уже скачаны. Быстрее на повторных
# запусках и не отмечает лишний раз использование токена. Включайте, когда
# всё уже работает.
offline_models: false

# --- Нарезка стенограммы --------------------------------------------------

# Окно модели в токенах. Отсюда считается размер фрагмента: нарезка нужна
# ровно потому, что стенограмма не влезает в окно целиком.
llm_context_tokens: 8192

# Размер фрагмента вручную. Пусто — считать от окна. Задают его, чтобы
# сделать фрагменты МЕНЬШЕ расчётных: мелкая модель на длинном куске теряет
# поручения из середины. Разумное значение для 7B — 1200.
chunk_max_tokens:

# Сколько реплик повторить в начале следующего фрагмента. Поручение часто
# разложено на две реплики — «подготовьте отчёт» и «до среды», — и на
# границе фрагментов срок теряется.
chunk_overlap_blocks: 1

# --- Модель, которая ищет поручения ---------------------------------------

# Адрес сервера: Ollama — 11434, LM Studio — 1234.
llm_base_url: http://localhost:11434/v1

llm_model: mistral

# Сводить ли поручения, сказанные разными словами. Правила снимают только
# буквальные повторы, а фрагменты пересекаются, и одно поручение приезжает
# дважды: «подтвердить статус дорожной карты» и «проинформировать о текущем
# статусе дорожной карты». Стоит одного лишнего запроса к модели.
merge_similar: true

# Просить ли строгий JSON. Для мелких моделей это решающая разница: иначе они
# вместо ответа переписывают стенограмму. Сервер, который так не умеет,
# ответит отказом, и запрос повторится по-старому.
llm_json_mode: true

# Что добавить к указаниям модели. Дописывается в конец; правила формата
# ответа этим не трогаются — их изменение сломает разбор. Сюда идёт
# предметное: что считать поручением у вас и как это называть. Например:
#   prompt_extra: |
#     Поручения у нас называются заданиями.
#     Не считай поручением просьбу подключиться или выступить.
prompt_extra: ""

# Файл со своим системным указанием целиком, вместо встроенного. Для тех,
# кто понимает, что делает: правила формата придётся написать самому.
prompt_file:

# Низкая температура намеренно: задача извлекающая, а не сочинительская.
llm_temperature: 0.1

# Предел длины ответа. Тысячи не хватает: на плотном фрагменте модель
# выписывает десяток поручений и обрывается на полуслове. Оборванный ответ
# разбирается частично — что успело уместиться, то сохранится, — но лучше
# до этого не доводить.
llm_max_tokens: 3000

# Местная модель отвечает медленно, особенно первый запрос после загрузки
# весов. Короткий таймаут здесь ломает работу чаще, чем спасает.
llm_timeout_s: 180
llm_retries: 2

# --- Пути -----------------------------------------------------------------

# Относительные считаются от папки приложения. Абсолютные берутся как есть —
# в том числе сетевые, и это обычный способ работы: протоколы кладутся туда,
# откуда их забирает другое подразделение, без пересылки.
#
#   output_dir: I:\Протоколы
#   output_dir: \\сервер\общая\Протоколы
#
# Буква диска годится: в домене их раздаёт групповая политика, и у всех они
# одинаковы. Путь UNC (\\сервер\...) нужен в двух случаях: диск подключают
# руками, или приложение работает без сеанса пользователя — из планировщика
# или службы, где подключённых букв нет вовсе.
input_dir: data/input
output_dir: data/output

# Промежуточное: извлечённый звук и результаты шагов. Гигабайты копятся
# именно здесь — двухчасовая запись даёт около 230 МБ одного только wav,
# и он читается на каждом шаге. Держите эту папку на местном диске: на
# сетевом расчёт заметно замедлится, а готовые файлы туда всё равно
# попадут — они весят килобайты.
work_dir: data/work
log_dir: logs
log_level: INFO
