# Инструмент обещает, что запись и стенограмма не покидают машину. Streamlit
# по умолчанию отправляет статистику использования на свои серверы — данных
# совещания там нет, но обещание есть обещание, да и на корпоративной машине
# исходящий трафик из ниоткуда порождает лишние вопросы.
[browser]
gatherUsageStats = false

[server]
# Загружают сюда записи совещаний: часовое видео легко превышает стандартные
# 200 МБ, и упереться в это на первом же файле обидно.
maxUploadSize = 2048

[theme]
base = "light"
